[workspace]
members = [
    "app/src-tauri",
    "crates/calibre_ai",
    "crates/calibre_conversion",
    "crates/calibre_customize",
    "crates/calibre_db",
    "crates/calibre_devices",
    "crates/calibre_ebooks",
    "crates/calibre_plugins_wasm",
    "crates/calibre_scraper_worker",
    "crates/calibre_srv",
    "crates/calibre_utils",
    "e2e",
    "tools/harness",
    "xtask",
]
# The old iced-based prototype lives in app-iced-prototype/ for reference —
# not a workspace member.
exclude = ["app-iced-prototype"]
resolver = "2"

# Inherited by every crate via `license.workspace = true`.
# calibre is GPL v3 (see old_src/LICENSE and its own `__license__`
# declarations, none of which say "or later"), and this is a
# derivative port of it, so GPL-3.0-only is what it must carry.
[workspace.package]
license = "GPL-3.0-only"

