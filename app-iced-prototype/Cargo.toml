[package]
name = "lexmechanic"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.10"
lexmechanic_utils = { path = "../crates/lexmechanic_utils" }
lexmechanic_db = { path = "../crates/lexmechanic_db" }
lexmechanic_ebooks = { path = "../crates/lexmechanic_ebooks" }
iced = { version = "0.12", features = ["debug", "image"] }
wry = "0.24"
tao = "0.16"                                               # Underlying windowing library often used with wry
mime_guess = "2.0"
url = "2.5"

[[bin]]
name = "lexmechanic"
# path = "src/main.rs" # Standard layout
