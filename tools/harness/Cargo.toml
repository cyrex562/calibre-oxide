[package]
name = "harness"
version = "0.1.0"
edition = "2021"
description = "Iterative-porting harness for calibre-oxide"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.10"
