<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lexmechanic</title>
    <script>
      // The skin is set before the first paint (main.ts sets it again; see library/skin.ts).
      try {
        var skin = localStorage.getItem("lexmechanic.skin");
        document.documentElement.setAttribute("data-skin", skin === "modern" ? "modern" : "classic");
      } catch (e) {
        document.documentElement.setAttribute("data-skin", "classic");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
