[package]
name = "lexmechanic_plugins_wasm"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "WASM plugin host for Lexmechanic (issue #798) -- sandboxed, capability-restricted third-party plugins."

[dependencies]
lexmechanic_customize = { path = "../lexmechanic_customize" }
lexmechanic_utils = { path = "../lexmechanic_utils" }
extism = "1.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
zip = "0.6"
url = "2.5"
reqwest = { version = "0.11", features = ["blocking"] }

[dev-dependencies]
tempfile = "3.10"
zip = "0.6"
