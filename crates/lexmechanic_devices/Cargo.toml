[package]
name = "lexmechanic_devices"
version = "0.1.0"
edition = "2021"

license.workspace = true
[dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lexmechanic_utils = { path = "../lexmechanic_utils" }
lexmechanic_ebooks = { path = "../lexmechanic_ebooks" }
uuid = { version = "1.0", features = ["v4"] }
byteorder = "1.4"
regex = "1.10"
nusb = "0.2"

[dev-dependencies]
tempfile = "3.10"
