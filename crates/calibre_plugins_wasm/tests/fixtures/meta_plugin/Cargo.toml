[package]
name = "meta_plugin"
version = "1.0.0"
edition = "2021"

# Not a workspace member: targets wasm32-unknown-unknown, built by ../build.sh.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
