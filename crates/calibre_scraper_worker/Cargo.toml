[package]
name = "calibre_scraper_worker"
version = "0.1.0"
edition = "2021"
description = "Headless-ish JS-rendering fetch worker for calibre_ebooks::scraper::WebEngineBrowser, driven by an OS-native webview (wry/tao -- the same stack the Tauri app uses)."

[[bin]]
name = "calibre_scraper_worker"
path = "src/main.rs"

[dependencies]
tao = "0.35"
wry = "0.55"
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
