[package]
name = "calibre_utils"
version = "0.1.0"
edition = "2021"

[dependencies]
lazy_static = "1.4"
directories = "5.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
fancy-regex = "0.19"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v5"] }
unidecode = "0.3"
html2text = "0.6"
aho-corasick = "1.1.4"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
indexmap = "2.12.1"
roxmltree = "0.21.1"
trash = "5.2.5"
console = "0.16.2"
libc = "0.2.178"
dirs = "6.0.0"
# Used unconditionally by mem.rs, seven_zip.rs, unrar.rs and
# unicode_names.rs, so they cannot live under a cfg(windows) table.
memory-stats = "1.2.0"
sevenz-rust = "0.6.1"
unrar = "0.5.8"
unicode_names2 = "2.0.0"
socket2 = "0.6.1"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
url = "2.5.8"
reqwest = { version = "0.11", features = ["blocking"] }
image = { version = "0.24", default-features = false, features = ["bmp", "png"] }
isolang = { version = "2.4.0", features = ["english_names", "lowercase_names"] }
shlex = "2.0.1"
walkdir = "2.5.0"
mime_guess = "2.0.5"
htmlentity = "1.3.2"
# Used unconditionally by tdir_in_cache.rs's real tdir_in_cache(), not
# just tests -- see that module's own doc.
tempfile = "3.24.0"
# Real Unicode Collation Algorithm implementation for icu.rs's
# sort_key/strcmp/primary_* -- chosen over `rust_icu` (real ICU4C
# bindings, matching upstream's own choice) because it's pure Rust:
# no system libicu-dev + a working libclang bindgen toolchain needed
# (this box's libclang is headless, missing its bundled builtin
# headers -- `stddef.h` isn't found -- so `rust_icu`'s bindgen build
# fails here; see issue #459's own PR discussion). Also consistent
# with this project's established preference for pure-Rust over C
# bindings when a real one exists (see calibre_ebooks::spell's
# `spellbook` choice, issue #59).
icu = { version = "1.5", features = ["compiled_data"] }
# Used by localunzip.rs for raw-deflate (no zlib header) decompression,
# matching upstream's `zlib.decompressobj(-15)`.
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
