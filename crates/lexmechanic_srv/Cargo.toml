[package]
name = "lexmechanic_srv"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Lexmechanic content server (issue #60) -- an axum/tokio HTTP server replacing calibre's own hand-rolled event loop."

[[bin]]
name = "lexmechanic_srv"
path = "src/main.rs"

# Reads PDFs for the library jobs in a process of its own, so a crash or a hang
# in PDFium costs one file instead of the server. Built with `lexmechanic_srv` so it
# sits next to it, where `lexmechanic_db::pdf_worker::locate_worker` looks.
[[bin]]
name = "lexmechanic_pdf_worker"
path = "src/bin/lexmechanic_pdf_worker.rs"

[dependencies]
# Line diffs for the editor's before/after view (#816 item 3.5).
similar = "2"
# Validating user-supplied mapper patterns up front (#816 item 1.7).
regex = "1"
lexmechanic_conversion = { path = "../lexmechanic_conversion" }
lexmechanic_db = { path = "../lexmechanic_db" }
lexmechanic_ebooks = { path = "../lexmechanic_ebooks" }
lexmechanic_customize = { path = "../lexmechanic_customize" }
lexmechanic_plugins_wasm = { path = "../lexmechanic_plugins_wasm" }
lexmechanic_utils = { path = "../lexmechanic_utils" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
# Runtime, not test-only: `upload::stream_to_file` drives the request
# body as a `Stream` (#883). Was in `[dev-dependencies]`, where
# `cargo test --lib` still linked it and only a plain library build
# caught the difference.
futures-util = "0.3.34"
tower-http = { version = "0.6", features = ["trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
mime_guess = "2.0"
urlencoding = "2.1"
indexmap = "2"
base64 = "0.21"
rusqlite = { version = "0.30", features = ["bundled"] }
rand = "0.9"
mdns-sd = "0.21.1"
hostname = "0.4.2"
sha2 = "0.10"
tempfile = "3.10"
filetime = "0.2.26"
# Embeds the vendored MathJax bundle (resources/mathjax/, issue #484)
# into the compiled binary at build time, so serving it doesn't depend
# on the process's working directory at runtime.
include_dir = "0.7"
fontdb = "0.24"
url = "2.5.8"
zip = "0.6"
walkdir = "2.5.0"
reqwest = { version = "0.11", features = ["blocking"] }

[dev-dependencies]
tower = "0.5"
# Tests only: decoding a stored cover to check *which* PDF page it came
# from. Production code here never touches pixels -- the rasterizer and
# its encoders live in lexmechanic_ebooks -- so this genuinely belongs in
# dev-dependencies rather than being the #761 mistake again.
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
tokio-tungstenite = "0.30.0"
