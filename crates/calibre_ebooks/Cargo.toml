[package]
name = "calibre_ebooks"
version = "0.1.0"
edition = "2021"

[dependencies]
calibre_utils = { path = "../calibre_utils" }
calibre_customize = { path = "../calibre_customize" }
uuid = { version = "1.0", features = ["v4"] }
roxmltree = "0.18"
zip = "0.6"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
lazy_static = "1.4"
indexmap = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5.0"
flate2 = "1.0"
base64 = "0.21"
lopdf = "0.38.0"
bzip2 = "0.4"
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
ignore = "0.4.25"
encoding_rs = "0.8"
tempfile = "3.24.0"
walkdir = "2.4"
urlencoding = "2.1.3"
pulldown-cmark = "0.13.0"
pathdiff = "0.2"
mime_guess = "2.0"
html-escape = "0.2"
chardetng = "1.0"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
libchm = "0.2.0"
html5ever = "0.26"
markup5ever_rcdom = "0.2"
rand = "0.9"
unicode-normalization = "0.1"
reqwest = { version = "0.11", features = ["blocking"] }
cssparser = "0.37.0"
unicode-segmentation = "1.11"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif"] }
jpeg-decoder = "0.3"

[dev-dependencies]
